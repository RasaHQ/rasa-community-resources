# OpenAI — TTS
#
# Verified against the live API.
# Requires: OPENAI_API_KEY
#
# Drop this block into `channels.inspector` in integrations.yml, either on its
# own or as one entry in a router `providers:` list. Inside a router the `name`
# and its settings are exactly the same; only the indentation changes.

    tts:
      name: voicerouter.providers.openai.OpenAITTS
      language_map:
        en: { voice: alloy }          # alloy, echo, fable, onyx, nova, shimmer
      model_id: gpt-4o-mini-tts       # `model_id`, not `model` — see the README
      # instructions: "Speak briskly and warmly."   # gpt-4o-mini-tts only
