[project]
name = "voice-vendor-router"
version = "0.1.0"
description = "Vendor-agnostic ASR/TTS routing for Rasa Mantle: failover, health, and any provider"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rasa-pro==3.20.0.dev6",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicerouter"]
