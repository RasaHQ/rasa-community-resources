[project]
name = "voice-vendor-router"
version = "0.1.0"
description = "Vendor-agnostic ASR/TTS routing for Rasa Mantle: failover, health, and any provider"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rasa-pro==3.20.0.dev6",
]

# NeuTTS is deliberately NOT declared as an optional dependency here.
#
# rasa-pro pins numpy>=2.1.3,<2.2.0; neutts requires numpy>=2.2.6. There is no
# resolution that satisfies both, so declaring the extra makes `uv sync` fail
# for everyone — including CI — whether or not they want local TTS.
#
# The adapter still ships and is skipped with a clear reason until neutts is
# importable. See the README for the two ways to actually run it.

# Open-source ASR. Unlike NeuTTS these resolve cleanly against rasa-pro's numpy
# pin on Python 3.12 (numpy 2.1.3 satisfies both), so they are a real extra:
#   uv sync --extra local-asr
[project.optional-dependencies]
local-asr = [
    # Pinned, not floated: vosk 0.3.45 publishes no macOS arm64 wheel — only
    # manylinux and win_amd64 — so a float breaks the extra outright on Apple
    # Silicon. 0.3.44 has the wheel and is what this resource is verified on.
    "vosk==0.3.44",
    "faster-whisper>=1.2.1",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicerouter"]
