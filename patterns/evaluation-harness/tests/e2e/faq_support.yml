# LLM-as-a-judge tests for the faq_support skill.
#
# These assertions do NOT compare strings. They send the bot's answer to a
# second LLM (configured in ../../conftest.yml) and compare a SCORE against a
# threshold. Read `docs` in the pattern README for how each score is computed —
# the two metrics work very differently and fail for different reasons.
#
# IMPORTANT — these assertions only see bot messages whose `utter_source`
# metadata is one of EnterpriseSearchPolicy, ContextualResponseRephraser or
# IntentlessPolicy (rasa/e2e_test/utils/generative_assertions.py:34-38), or
# whose source exactly equals an `utter_source:` you name here. A plain
# templated response is invisible to them. See the README section
# "Why a judge assertion can find nothing to score".

test_cases:
  - test_case: overdraft answer stays grounded in the policy text
    steps:
      - user: how much is the overdraft fee
        assertions:
          # `ground_truth` is supplied inline here, so the score does not depend
          # on retrieval metadata being present on the event. The text is copied
          # from skills/faq_support/tools.py — keep the two in sync.
          #
          # Score = supported statements / total statements extracted by the
          # judge (rasa/e2e_test/utils/generative_assertions.py:156-166).
          # 0.8 tolerates one unsupported statement out of five, not one out of two.
          - generative_response_is_grounded:
              threshold: 0.8
              ground_truth: >-
                The overdraft fee is $28 per transaction, charged at most three
                times per day. Accounts overdrawn by $5 or less are not charged
                a fee.

  - test_case: card replacement answer is relevant to the question asked
    steps:
      - user: what does it cost to replace my card
        assertions:
          # Relevance is NOT groundedness. The judge invents 3 questions the
          # answer would address, embeds them, and averages their cosine
          # similarity to what the user actually asked
          # (rasa/e2e_test/utils/generative_assertions.py:123-153).
          # A confidently wrong answer to the right question scores HIGH here.
          # Pair it with groundedness; neither is sufficient alone.
          - generative_response_is_relevant:
              threshold: 0.7

          - generative_response_is_grounded:
              threshold: 0.8
              ground_truth: >-
                A replacement debit card is issued free of charge once per
                calendar year. Additional replacements cost $12 each. Standard
                delivery takes five to seven business days.

  - test_case: unknown topic is refused rather than invented
    steps:
      # The most valuable eval in this file. A model that answers this from
      # general banking knowledge instead of the policy source will score badly
      # against a ground truth that says only "we do not have this".
      - user: what is the daily international wire transfer limit
        assertions:
          - generative_response_is_grounded:
              threshold: 0.8
              ground_truth: >-
                The assistant does not have information about international
                wire transfer limits and should say so, optionally offering to
                connect the customer to a human.
