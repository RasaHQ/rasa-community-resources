# LLM provider and channels for the fixture agent under test.
#
# `llm:` is a model_group REFERENCE. Provider, model and credentials live on the
# named group, never inline under `llm:` — since rasa-pro 3.20.0.dev6 the
# integration LLM config forbids extra keys and requires `model_group`.
llm:
  model_group: orchestrator

# This group configures the AGENT UNDER TEST only. The evaluation side — the
# user simulator and the judge — is configured separately in `eval/conftest.yml`
# with inline provider/model pairs, which is the shape the simulation framework
# documents. Keeping them apart is the point: changing the agent's model is an
# experiment; changing the judge's model changes what "pass" means.
model_groups:
  - id: orchestrator
    models:
      - provider: openai
        model: gpt-5.2
        api_key: ${OPENAI_API_KEY}

channels:
  rest:
    enabled: true
  inspector:
    enabled: true
