# Confirmation wording for the handoff. The promise made here — "you will not
# need to repeat yourself" — is one the context package has to actually keep,
# and tests/test_handoff_context.py is what keeps it honest.
responses:
  utter_confirm_handoff:
    - text: >-
        I'll bring in a specialist and pass them everything we've covered, so you
        won't need to repeat any of it. Shall I go ahead?
      metadata:
        rephrase: true
  utter_handoff_cancelled:
    - text: No problem — we'll keep going here. What would you like to do next?
      metadata:
        rephrase: true
