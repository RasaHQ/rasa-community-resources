schema:
  public:
    selected_account_id:
      type: text
      description: Id of the account chosen for this skill (acc_checking or acc_savings).
      llm_settable: true
    # Tool-set only (not llm_settable), so it carries no description — the engine
    # rejects descriptions on fields the LLM can't set.
    selected_account_label:
      type: text
