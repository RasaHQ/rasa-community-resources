# LLM provider and channels. The pattern is text-only; personalization is
# channel-agnostic, so no voice config is needed to demonstrate it.
# The orchestrator LLM is a model-group reference. Provider, model and
# credentials live on the named group, never inline under `llm:` — the
# inline form was removed in rasa-pro 3.20.0.dev6.
llm:
  model_group: orchestrator

model_groups:
  - id: orchestrator
    models:
      - provider: openai
        model: gpt-5.2
        api_key_env: OPENAI_API_KEY

channels:
  rest:
    enabled: true
  inspector:
    enabled: true
