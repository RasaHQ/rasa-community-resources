[project]
name = "jack-henry-banking-demo"
version = "0.1.0"
description = "Fictional banking conversations with shared server-side action guards"
requires-python = ">=3.12,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5", "banking-demo-shared[mcp]"]

[tool.uv.sources]
banking-demo-shared = { path = "../banking-shared", editable = true }

[tool.rasa-catalog]
license-secret = "RASA_PRO_LICENSE"
required-secrets = ["OPENAI_API_KEY", "DEEPGRAM_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
