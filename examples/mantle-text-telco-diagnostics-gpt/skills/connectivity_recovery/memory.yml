# Written only by the recovery tools (never llm_settable), so the step the
# engine asks the customer to confirm is always the step the tool resolved.
# selected_step_ref: selection reference from select_recovery_step.
# selected_step_label: operation, service and address, read in the question.
# selected_step_boundary: the operation's disruption boundary, word for word.
schema:
  public:
    selected_step_ref:
      type: text
    selected_step_label:
      type: text
    selected_step_boundary:
      type: text
