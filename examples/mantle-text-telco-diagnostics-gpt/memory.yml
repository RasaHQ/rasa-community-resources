# Project-wide memory (session.project.*). Written by load_customer_profile at
# session start, never by the model. Project memory is write-once.
customer_id:
  type: text
  # Customer id of the caller this session is bound to.
customer_first_name:
  type: text
  # Customer's first name, for greeting.
# One field per service: Mantle cuts each rendered memory value at 100
# characters, so a joined list would lose its last entries.
service_1:
  type: text
  # One of the customer's services, as label, address and service id.
service_2:
  type: text
  # One of the customer's services, as label, address and service id.
service_3:
  type: text
  # One of the customer's services, as label, address and service id.
