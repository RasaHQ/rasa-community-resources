responses:
  utter_confirm_appointment:
    - text: >
        Shall I book you in on {selected_slot_date} at {selected_slot_time}?
  utter_appointment_cancelled:
    - text: Okay, I have not booked anything. Would another day suit you better?
  utter_appointment_booked:
    - text: >
        You are booked in for {selected_slot_date} at {selected_slot_time}.
        Please bring your driving licence and proof of address.
