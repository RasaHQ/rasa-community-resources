schema:
  public:
    monthly_income:
      type: float
      description: Customer's gross monthly income.
      llm_settable: true
    monthly_expenses:
      type: float
      description: Customer's regular monthly outgoings, excluding loan repayments.
      llm_settable: true
    down_payment:
      type: float
      description: Cash the customer can put down up front.
      llm_settable: true
    existing_loan_payments:
      type: float
    affordable_payment:
      type: float
    max_car_price:
      type: float
