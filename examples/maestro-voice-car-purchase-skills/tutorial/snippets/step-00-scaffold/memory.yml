# Project-wide memory shared across skills (session.project.*)
username:
  type: text
  description: Demo customer display name used by the Rasa Motors tools.
  initial_value: Alex Rivera
segment:
  type: text
  description: Customer segment (Retail, Fleet, SME).
  initial_value: Retail
email_address:
  type: text
  description: Customer email on file.
physical_address:
  type: text
  description: Customer mailing address on file.
car_model:
  type: text
  description: Car model the customer has reserved or is buying.
car_price:
  type: float
  description: Advertised price of the car the customer is buying.
dealer_name:
  type: text
  description: Rasa Motors dealer holding the customer's car.
