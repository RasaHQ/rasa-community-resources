responses:
  utter_recording_notice:
    - text: >
        This call may be recorded for quality assurance and training purposes.
  utter_finance_notice:
    - text: >
        Any finance figures I quote are estimates, not a binding offer.
        Your dealer confirms the final terms.
  utter_confirm_reserve:
    - text: >
        Shall I hold the {selected_model} at {selected_dealer} for you?
  utter_reserve_cancelled:
    - text: Okay, I will not hold that car.
  utter_reserved:
    - text: >
        Done. The {selected_model} is held for you at {selected_dealer}
        for the next three business days.
