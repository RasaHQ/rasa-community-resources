# Project-wide memory (session.project.*). Written by load_caller_profile at
# session start, never by the model. One short field per value (under 100
# characters; tests/test_guard.py checks them).
customer_id:
  type: text
  # Customer id of the signed-in customer this session is bound to.
customer_first_name:
  type: text
  # Customer's first name, for greeting.
account_names:
  type: text
  # The customer's accounts, by name and last four digits.
