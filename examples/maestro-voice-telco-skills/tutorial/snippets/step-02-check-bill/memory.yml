schema:
  public:
    bill_month:
      type: text
      description: Calendar month selected for the bill lookup, such as February.
      llm_settable: true
    bill_amount:
      type: float
    average_bill:
      type: float
    difference:
      type: float
    wants_breakdown:
      type: bool
      description: Whether the customer wants a line-item breakdown of charges.
      llm_settable: true
