responses:
  utter_reset_warning:
    - text: >
        A factory reset erases custom Wi-Fi names and passwords.
        Your router will return to Telecom of Rasa setup defaults.
  utter_post_reboot_warning:
    - text: >
        Because a reboot did not restore your speed, a remote factory reset
        is the next step. You will need to reconnect your devices afterward.
  utter_confirm_reset_router:
    - text: Are you sure you want to factory-reset {selected_device_label}?
  utter_reset_cancelled:
    - text: Okay, I will not reset that router.
  utter_router_reset:
    - text: >
        {selected_device_label} has been factory-reset.
        The Wi-Fi name is now TelecomOfRasa-Setup.
