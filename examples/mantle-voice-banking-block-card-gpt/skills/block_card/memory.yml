# Written only by select_card (never llm_settable), so the card the engine
# asks the caller to confirm is always the card the tool resolved.
# selected_card_ref: card reference resolved for the verified caller.
# selected_card_label: spoken label read in the confirmation question.
schema:
  public:
    selected_card_ref:
      type: text
    selected_card_label:
      type: text
