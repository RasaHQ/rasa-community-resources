[project]
name = "mantle-voice-banking-block-card-gpt"
version = "0.1.0"
description = "Northgate Bank block-card voice agent on GPT-5.5 with Deepgram speech, the card guard enforced in the tool layer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5"]

[tool.rasa-catalog]
required-secrets = ["OPENAI_API_KEY", "DEEPGRAM_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
