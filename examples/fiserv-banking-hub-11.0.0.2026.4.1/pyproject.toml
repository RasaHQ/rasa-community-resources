[project]
name = "fiserv-banking-hub-release-demo"
version = "0.1.0"
description = "Fictional banking conversations on the learner-downloaded Fiserv Banking Hub release definitions"
requires-python = ">=3.12,<3.13"
dependencies = [
  "rasa-pro==3.21.0.dev5",
  "mcp>=1.28.1,<2",
  "pyyaml>=6,<7",
  "openapi-schema-validator>=0.6,<0.7",
  "jsonschema>=4.18",
  "referencing>=0.30",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
]

[tool.rasa-catalog]
license-secret = "RASA_LICENSE"
required-secrets = ["OPENAI_API_KEY", "DEEPGRAM_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false

[dependency-groups]
# Development only: regenerates bh_demo/vendor_models/ from the pinned Fiserv
# release archive (make models). Never installed for running the example.
models = ["datamodel-code-generator==0.87.0"]
