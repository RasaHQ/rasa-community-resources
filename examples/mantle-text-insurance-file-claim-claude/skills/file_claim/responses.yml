responses:
  # The contract's question, with the draft read back from memory. The draft
  # tag (id and version) is part of it: submit_claim_report checks that the
  # customer was asked about the current version.
  utter_confirm_claim_report:
    - text: >
        Here is the report I will submit: {claim_report_summary}. What
        happened: {claim_loss_summary}. Material received:
        {claim_material_received}. Still needed: {claim_material_followup}.
        Draft {claim_draft_tag}. Is that accurate?
