# Project-wide memory (session.project.*). Written by load_session_customer at
# session start, never by the model. One short field per value: Mantle cuts a
# memory value at 100 characters in the prompt, silently.
customer_id:
  type: text
  # Customer id of the signed-in policyholder this session is bound to.
customer_first_name:
  type: text
  # Signed-in policyholder's first name, for greeting.
policy_list:
  type: text
  # The policyholder's policy numbers and lines, separated by semicolons.
