[project]
name = "mantle-voice-banking-dispute-claude"
version = "0.1.0"
description = "Northgate Bank dispute-intake voice agent on Claude Sonnet 5.5 with Speechmatics and Rime speech, the dispute guard enforced in the tool layer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rasa-pro==3.21.0.dev5",
    # Speechmatics speech-to-text is not built into Rasa. The adapter is the
    # companion's voice-vendor-router package, vendored in
    # vendor/voice-vendor-router and used as a plain engine class
    # (voicerouter.providers.speechmatics.SpeechmaticsASR), not through RoutedASR.
    "voice-vendor-router",
]

[tool.rasa-catalog]
required-secrets = ["ANTHROPIC_API_KEY", "SPEECHMATICS_API_KEY", "RIME_API_KEY"]

# A path source inside this example: vendor/voice-vendor-router is a copy of
# patterns/voice-vendor-router (its README names the commit), so this folder
# works on its own.
[tool.uv.sources]
voice-vendor-router = { path = "vendor/voice-vendor-router", editable = true }

[tool.uv]
prerelease = "allow"
package = false
