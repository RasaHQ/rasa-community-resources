# Written only by select_transaction (never llm_settable), so the charge the
# engine reads back for confirmation is always the one the tool resolved.
# selected_transaction_ref: transaction reference resolved for the verified caller.
# selected_transaction_label: spoken description read in the confirmation question.
schema:
  public:
    selected_transaction_ref:
      type: text
    selected_transaction_label:
      type: text
