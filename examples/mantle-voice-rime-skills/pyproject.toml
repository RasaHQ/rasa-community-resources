[project]
name = "vela-voice-rime"
version = "0.1.0"
description = "Voice banking agent on Rasa Mantle with Rime TTS and Deepgram ASR"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rasa-pro==3.20.0.dev1",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
