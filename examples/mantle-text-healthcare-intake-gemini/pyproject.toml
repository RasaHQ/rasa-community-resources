[project]
name = "mantle-text-healthcare-intake-gemini"
version = "0.1.0"
description = "Cedar Clinic pre-visit intake in web chat, on Gemini, where an eligibility check is never a promise of payment"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5"]

[tool.rasa-catalog]
required-secrets = ["GEMINI_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
