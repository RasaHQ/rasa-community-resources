responses:
  # The contract's question, with the intake read back from memory. The tag
  # (id and version) is part of it: record_intake checks that the patient was
  # asked about the current version.
  utter_confirm_intake:
    - text: >
        Here is the intake I will record for your {intake_visit}:
        {intake_contact}; insurance {intake_insurance}. Payer response:
        {intake_payer_response}. Open question: {intake_open_question}. Intake
        {intake_tag}. Is that correct?
