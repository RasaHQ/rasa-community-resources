# Project-wide memory (session.project.*). Written by load_session_patient at
# session start, never by the model. One short field per value: Mantle cuts a
# memory value at 100 characters in the prompt, silently.
patient_id:
  type: text
  description: Patient id of the signed-in patient this session is bound to.
patient_first_name:
  type: text
  description: Signed-in patient's first name, for greeting.
visit_summary:
  type: text
  description: The patient's upcoming visit, kind, date and time.
