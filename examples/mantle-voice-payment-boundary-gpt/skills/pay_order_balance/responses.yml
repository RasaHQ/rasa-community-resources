# The case's question: "Please use the secure payment step; do not read card
# details to me. Would you like that option?" There is no utter_on_user_denial
# on purpose: with one set, a correction made at this question is answered
# only by the canned denial line (found in the GPT and Claude text builds).
responses:
  utter_confirm_payment_link:
    - text: >
        I can send a secure payment link for {pay_order_label}, {pay_channel_label}.
        Please use that secure step, and don't read card details to me. Would you
        like that?
