# The case's question: "This change affects the selected segment and these
# connected services. Shall I check all of them before proceeding?" There is no
# utter_on_user_denial on purpose: with one set, a correction made at this
# question is answered only by the canned denial line (found in the GPT and
# Claude text builds).
responses:
  utter_confirm_journey_change:
    - text: >
        This moves {change_label}, and it affects {services_label}. Shall I
        check all of them before proceeding?
