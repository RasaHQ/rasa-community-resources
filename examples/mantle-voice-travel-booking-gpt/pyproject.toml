[project]
name = "mantle-voice-travel-booking-gpt"
version = "0.1.0"
description = "Horizon Travel journey-change voice agent on GPT-5.5 with Deepgram Flux and Rime speech: a flight segment changes only with its linked connection, transfers, bag and parking, each reconciled and reported, for a fictional travel company"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5"]

[tool.rasa-catalog]
required-secrets = ["OPENAI_API_KEY", "DEEPGRAM_API_KEY", "RIME_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
