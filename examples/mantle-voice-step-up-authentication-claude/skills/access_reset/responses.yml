responses:
  # The contract's question, with the prepared request read back. No
  # utter_on_user_denial: a denial response ends the turn and drops a
  # correction made in the same answer (found in the earlier builds).
  utter_confirm_verification:
    - text: >
        I need to verify this request before changing access: {pending_action_label}
        for {pending_subject_label}. Continue with the verification step?
