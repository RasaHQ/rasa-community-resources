# Written only by prepare_access_request (never llm_settable), so the request
# the engine asks the caller to confirm is always the one the tool resolved.
# pending_request_ref: request (employee and action) waiting for verification.
# pending_subject_label: the employee's name, read in the question.
# pending_action_label: the change, read in the question.
schema:
  public:
    pending_request_ref:
      type: text
    pending_subject_label:
      type: text
    pending_action_label:
      type: text
