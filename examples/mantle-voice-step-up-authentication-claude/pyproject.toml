[project]
name = "mantle-voice-step-up-authentication-claude"
version = "0.1.0"
description = "Orchard Works IT service desk voice agent on Claude Sonnet 5.5 with Deepgram Flux and Aura, where a familiar name never authorizes an access change"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5"]

[tool.rasa-catalog]
required-secrets = ["ANTHROPIC_API_KEY", "DEEPGRAM_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
