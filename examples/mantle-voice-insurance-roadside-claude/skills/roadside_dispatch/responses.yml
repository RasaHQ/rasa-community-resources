responses:
  # The contract's question, with the draft read back from memory. No
  # utter_on_user_denial: a denial response ends the turn and drops a
  # correction made in the same answer (found in the earlier builds), so the
  # model answers a changed place in the same turn.
  utter_confirm_location:
    - text: >
        Please confirm where the vehicle is now; that may differ from the
        address on the policy. I have your {pending_vehicle_label} at
        {pending_location_label}, for {pending_service_label}. Is that right?
