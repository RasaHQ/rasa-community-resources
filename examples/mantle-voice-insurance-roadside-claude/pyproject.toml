[project]
name = "mantle-voice-insurance-roadside-claude"
version = "0.1.0"
description = "HarborCover roadside assistance voice agent on Claude Sonnet 5.5 with Deepgram Flux and Aura, which sends help only to the place the driver confirmed"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5"]

[tool.rasa-catalog]
required-secrets = ["ANTHROPIC_API_KEY", "DEEPGRAM_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
