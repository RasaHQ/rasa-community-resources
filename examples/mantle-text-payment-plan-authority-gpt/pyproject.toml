[project]
name = "mantle-text-payment-plan-authority-gpt"
version = "0.1.0"
description = "Amber Grid payment-plan offers in web chat, on GPT-5.5, where only the billing service's authorized terms can be presented or recorded"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5"]

[tool.rasa-catalog]
required-secrets = ["OPENAI_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
