# Project-wide memory (session.project.*). Written once by
# load_customer_profile at session start, never by the model. One short field
# per value: Mantle cuts a memory value at 100 characters in the prompt,
# silently; tests/test_guard.py checks these.
customer_id:
  type: text
  description: Customer id of the signed-in customer this session is bound to.
customer_first_name:
  type: text
  description: Customer's first name, for greeting.
account_list:
  type: text
  description: The customer's own accounts, number and label, separated by semicolons.
