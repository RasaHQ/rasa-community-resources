# External integrations for the Willow Shop subscriptions agent.
#
# The orchestrator LLM is a model-group reference. Rasa's OpenAI client sends
# gpt-5.5-2026-04-23 through LiteLLM.
#
# reasoning_effort is set to low rather than Rasa's default for this model,
# which is none (rasa/shared/utils/llm.py, _apply_default_reasoning_effort).
# In the Northgate block-card build (examples/mantle-voice-banking-block-card-gpt),
# at none GPT-5.5 twice wrote a tool call out as text that Mantle sent to the
# caller, and twice announced an action and ended the turn without taking it;
# at low, on the same nine calls, it did neither, for about 130 ms more to the
# first token. This agent's job is a gated select-then-apply sequence where
# the wrong one of three commands is the case's failure: an agent that says
# "I've cancelled that" without calling apply_subscription_change, or prints
# the call as its reply, fails this case, so the build starts at low. The
# `reasoning-default` variant in case-build/conversations.json removes this
# line.
llm:
  model_group: orchestrator

model_groups:
  - id: orchestrator
    models:
      - provider: openai
        model: gpt-5.5-2026-04-23
        api_key: ${OPENAI_API_KEY}
        reasoning_effort: low

# Mantle reads channels from here, never from credentials.yml.
#
# Target channel: Telegram. The build has no Telegram bot token yet, so it
# serves web chat: `rest` is the HTTP endpoint (/webhooks/rest/webhook) the
# build harness drives; `socketio` is what a browser chat widget connects to;
# `inspector` serves `rasa inspect`.
#
# With a bot token from Telegram's BotFather, add Rasa's `telegram` channel
# (/webhooks/telegram/webhook). It needs aiogram, which the pinned
# rasa-pro==3.21.0.dev5 installs only with its `channels` extra; without it,
# rasa.core.channels leaves TelegramInput as None and the channel is unknown.
#
#   telegram:
#     access_token: ${TELEGRAM_BOT_TOKEN}
#     verify: ${TELEGRAM_BOT_USERNAME}
#     webhook_url: https://<public host>/webhooks/telegram/webhook
#
# The Telegram sender id is the chat id, so each Telegram chat is its own
# conversation and its own member session.
channels:
  rest:
    enabled: true
  socketio:
    enabled: true
    user_message_evt: user_uttered
    bot_message_evt: bot_uttered
    session_persistence: true
  inspector:
    enabled: true
