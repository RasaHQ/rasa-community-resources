#models:
#  url: http://my-server.com/models/default_core@latest
#  wait_time_between_pulls: 10

# Backend tracing (jaeger / otlp):
#tracing:
#  type: otlp
#  endpoint: localhost:4317
#  service_name: poly

# NOTE: Do not add a classic `action_endpoint` / `actions_module` here.
# Side effects use Mantle @tool functions under tools/ and skills/*/tools.py,
# not rasa-sdk actions.
