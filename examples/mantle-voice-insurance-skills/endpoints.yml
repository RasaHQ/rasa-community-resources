# Platform endpoints for the Poly Mantle (rasa.mantle) agent.
#
# LLM routing and Inspector Deepgram ASR/TTS live in integrations.yml.
# This file is still read by `rasa train` / `rasa inspect` for optional
# platform services (NLG, tracker store, tracing, etc.).
#
# Docs: https://rasa.com/docs/pro/build/configuring-assistant/

# ---------------------------------------------------------------------------
# Contextual response rephraser
# ---------------------------------------------------------------------------
# Honours `metadata.rephrase: true` on responses (for example utter_greet).
# Uses the same OpenAI model family as integrations.yml.
# https://rasa.com/docs/pro/build/configuring-assistant/#contextual-response-rephraser
nlg:
  type: rephrase
  llm:
    model_group: openai-llm

# ---------------------------------------------------------------------------
# Model groups (LLMs / embeddings referenced by endpoints features)
# ---------------------------------------------------------------------------
# https://rasa.com/docs/reference/config/components/llm-configuration/
# Do not set temperature on GPT-5 reasoning models — they reject a non-default.
model_groups:
  - id: openai-llm
    models:
      - provider: openai
        model: gpt-5.2
        api_key: ${OPENAI_API_KEY}
  - id: openai-embeddings
    models:
      - provider: openai
        model: text-embedding-3-large
        api_key: ${OPENAI_API_KEY}

# ---------------------------------------------------------------------------
# Optional production services (defaults are fine for local demos)
# ---------------------------------------------------------------------------
# Tracker store — conversations stay in memory unless configured:
# https://rasa.com/docs/pro/build/configuring-assistant/#tracker-store
#tracker_store:
