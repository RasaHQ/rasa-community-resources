responses:
  utter_claim_recording_notice:
    - text: >
        This call may be recorded for quality assurance and training purposes.
  utter_auto_extra_fields:
    - text: >
        For auto claims I will also need the time and location of the incident.
  utter_home_extra_fields:
    - text: >
        For homeowners claims I will collect a short description and any
        extra details you want on file.
  utter_confirm_submit_claim:
    - text: >
        Shall I submit this {policy_name} claim under policy {policy_num}?
  utter_claim_cancelled:
    - text: Okay, I will not submit that claim.
  utter_claim_submitted:
    - text: >
        I have submitted your claim number 12345.
        An adjuster will be assigned to your claim.
  utter_invalid_date:
    - text: >
        Sorry, I could not read that as a date.
        Please give the incident date as month day year, for example
        March twenty fifth twenty twenty six.
