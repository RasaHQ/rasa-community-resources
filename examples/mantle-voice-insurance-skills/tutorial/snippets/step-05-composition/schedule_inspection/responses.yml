responses:
  utter_confirm_inspection:
    - text: >
        Shall I request inspection scheduling for claim {claim_number}
        on {inspection_date}?
  utter_inspection_cancelled:
    - text: Okay, I will not schedule that inspection.
  utter_inspection_scheduled:
    - text: >
        Thank you. I have sent your request to schedule the inspection
        on {inspection_date}.
