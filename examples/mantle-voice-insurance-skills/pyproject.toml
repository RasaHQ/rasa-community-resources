[project]
name = "poly-voice-insurance"
version = "0.1.0"
description = "Build-with-me tutorial: voice insurance agent with Rasa Skills + Deepgram"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "rasa-pro==3.20.0.dev6",
    "python-dateutil>=2.9.0",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
