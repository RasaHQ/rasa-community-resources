[project]
name = "atlas-voice-travel"
version = "0.1.0"
description = "Flagship tutorial: voice travel agent with Rasa Skills + Deepgram"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "rasa-pro==3.19.0.dev3",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
