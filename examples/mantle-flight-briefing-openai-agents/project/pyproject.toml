[project]
name = "mantle-flight-briefing-conversation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rasa-pro==3.21.0.dev5",
    "zeocore==0.27.3.dev17",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.uv.sources]
zeocore = { path = "../worker/inputs/zeocore-0.27.3.dev17-py3-none-any.whl" }

[tool.rasa-catalog]
required-secrets = ["BRIEFING_MCP_TOKEN"]
