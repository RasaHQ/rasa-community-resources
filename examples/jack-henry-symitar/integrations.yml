llm:
  model_group: orchestrator
model_groups:
  - id: orchestrator
    models:
      - provider: openai
        model: gpt-4o-mini
        temperature: 0
        api_key: ${OPENAI_API_KEY}
channels:
  inspector:
    enabled: true
    interruptions:
      enabled: true
      min_words: 1
    asr:
      name: voice_privacy.OptOutASR
      language_map:
        en:
          model: flux-general-en
      eot_threshold: 0.7
      eot_timeout_ms: 1000
    tts:
      name: voice_privacy.OptOutTTS
      language_map:
        en:
          model: aura-2-andromeda-en
