# Project-wide memory (session.project.*). Written by load_session_employee at
# session start, never by the model. One short field per value: Mantle cuts a
# memory value at 100 characters in the prompt, silently.
employee_id:
  type: text
  description: Employee id of the signed-in employee this session is bound to.
employee_first_name:
  type: text
  description: Signed-in employee's first name, for greeting.
employee_team:
  type: text
  description: Signed-in employee's team.
