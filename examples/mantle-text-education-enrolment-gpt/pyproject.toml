[project]
name = "mantle-text-education-enrolment-gpt"
version = "0.1.0"
description = "Pine University enrolment and financial-aid enquiries in web chat, on GPT-5.5, where a received form is never described as an award"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5"]

[tool.rasa-catalog]
required-secrets = ["OPENAI_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
