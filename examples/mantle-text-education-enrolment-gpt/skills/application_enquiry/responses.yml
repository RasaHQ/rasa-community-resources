responses:
  # The contract's question ("Your form is at this stage; the responsible team
  # has not issued a decision yet. Would you like help with the listed next
  # step?"), filled from the record lookup_application wrote to skill memory.
  # No utter_on_user_denial: a correction given in answer to this question is
  # answered in the same turn.
  utter_confirm_enquiry:
    - text: >
        Your {enquiry_form} {enquiry_ref} is at this stage: {enquiry_stage}.
        {enquiry_decision} Next step: {enquiry_next_step} Would you like me to
        record your enquiry about it with the {enquiry_team}?
