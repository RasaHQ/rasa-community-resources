# Project-wide memory (session.project.*). Written by load_applicant_profile at
# session start, never by the model. One short field per value: Mantle cuts a
# memory value at 100 characters in the prompt, silently.
applicant_id:
  type: text
  description: Applicant id of the signed-in applicant this session is bound to.
applicant_first_name:
  type: text
  description: Signed-in applicant's first name, for greeting.
application_list:
  type: text
  description: The applicant's application references and kinds, separated by semicolons.
