schema:
  public:
    contact_name:
      type: text
      description: Name of the contact being saved.
      llm_settable: true
    contact_handle:
      type: text
      description: Handle of the contact being saved, for example @JoeMyers.
      llm_settable: true
    relationship:
      type: text
      description: Short label for the contact such as friend, sister, or doctor.
      llm_settable: true
    contact_confirmed:
      type: bool
      description: Patient confirmed the contact name and handle are correct.
      llm_settable: true
    contact_exists:
      type: bool
    contact_added:
      type: bool
