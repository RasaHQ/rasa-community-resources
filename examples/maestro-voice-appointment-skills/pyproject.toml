[project]
name = "schedora-voice-appointment"
version = "0.1.0"
description = "Build-with-me tutorial: voice appointment-booking agent with Rasa Skills + Deepgram"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "rasa-pro==3.19.0.dev5",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
