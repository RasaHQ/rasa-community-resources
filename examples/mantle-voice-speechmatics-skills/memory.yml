# Project-wide memory shared across skills (session.project.*).
# Loaded once at session start by tools/profile.py, so no skill repeats the
# lookup and no skill has to ask who it is talking to.
customer_name:
  type: text
  description: The name to address the customer by. Set at session start.
customer_id:
  type: text
  description: Internal customer id used by the banking tools. Set at session start.
