responses:
  utter_confirm_transfer:
    - text: >-
        Transferring {amount} dollars from your {from_account} to your
        {to_account}. Shall I go ahead?
      metadata:
        rephrase: true
  utter_transfer_cancelled:
    - text: No problem, I have cancelled that transfer.
  utter_transfer_complete:
    - text: >-
        Done. Your reference is {transfer_reference}. Anything else?
