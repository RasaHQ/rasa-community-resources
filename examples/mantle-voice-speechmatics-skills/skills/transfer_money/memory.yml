schema:
  public:
    from_account:
      type: text
      description: Source account as the caller named it.
      llm_settable: true
    to_account:
      type: text
      description: Destination account as the caller named it.
      llm_settable: true
    amount:
      type: float
      description: Amount to transfer, in dollars.
      llm_settable: true
    transfer_confirmed:
      type: bool
      description: The caller confirmed the transfer details read back to them.
      llm_settable: true
    sufficient_funds:
      type: bool
    transfer_reference:
      type: text
