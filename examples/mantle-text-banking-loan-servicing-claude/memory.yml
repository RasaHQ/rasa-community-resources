# Project-wide memory (session.project.*). Written by load_caller_profile at
# session start, never by the model. One short field per loan: Mantle cuts a
# memory value longer than 100 characters in the prompt without saying so.
customer_id:
  type: text
  description: Customer id of the signed-in customer this session is bound to.
customer_first_name:
  type: text
  description: Customer's first name, for greeting.
loan_auto:
  type: text
  description: The customer's auto loan, by product and last four digits.
loan_personal:
  type: text
  description: The customer's personal loan, by product and last four digits.
loan_home_equity:
  type: text
  description: The customer's home equity loan, by product and last four digits.
loan_boat:
  type: text
  description: The customer's boat loan, by product and last four digits.
