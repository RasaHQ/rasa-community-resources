[project]
name = "mantle-text-banking-loan-servicing-claude"
version = "0.1.0"
description = "Northgate Bank loan servicing in web chat, on Claude Sonnet 5.5, with dated payoff quotes guarded in the tool layer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5"]

[tool.rasa-catalog]
required-secrets = ["ANTHROPIC_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
