# External integrations for the Northgate advisor-appointment voice agent.
#
# The orchestrator LLM is a model-group reference, configured as in the
# Northgate dispute build (mantle-voice-banking-dispute-claude). Rasa sends
# Claude Sonnet 5.5 through LiteLLM's Anthropic provider (DefaultLiteLLMClient;
# Rasa has no dedicated Anthropic client). No reasoning or thinking setting is
# given and no prompt caching is configured: Rasa sets a default
# reasoning_effort only for OpenAI-family models and deliberately skips Claude
# on anthropic and bedrock (rasa/shared/utils/llm.py,
# _is_claude_model_on_anthropic_or_bedrock), so the model runs at its own API
# defaults (see README).
llm:
  model_group: orchestrator

model_groups:
  - id: orchestrator
    models:
      - provider: anthropic
        model: claude-sonnet-5-5
        api_key: ${ANTHROPIC_API_KEY}

# Mantle reads channels from here, never from credentials.yml.
# `browser_audio` is the raw WebSocket voice channel a browser (or the case-build
# harness) streams to at /webhooks/browser_audio/websocket. `inspector` serves
# `rasa inspect` with the same speech stack.
channels:
  browser_audio:
    server_url: localhost
    # 16 kHz 16-bit PCM both ways. Deepgram Flux takes linear16 at the stream's
    # rate, Rime returns PCM at the rate asked for, and the caller fixtures are
    # recorded at this rate.
    sample_rate: 16000
    # The harness names each call, so the tracker, usage and logs join on one id.
    # Trusted local transports only: any client can pick any conversation id.
    external_sender_id_header: X-Rasa-Sender-Id
    silence_timeout: 30
    interruptions:
      enabled: false
    # Deepgram Flux, a Rasa built-in, with the settings of the Northgate
    # block-card build (mantle-voice-banking-block-card-gpt). Flux has one
    # English model and no en-GB variant; no language_hint is sent (see README).
    asr:
      name: deepgram
      language_map:
        en:
          model: flux-general-en
      eot_threshold: 0.7
      eot_timeout_ms: 5000
    # Rime, through Rasa's built-in engine with one change: the websocket is
    # reopened after 20 s idle (engines/rime_idle.py). Rime's socket went quiet
    # after about 30 s without traffic, and the built-in engine never reopens
    # it, so a long reply followed by an answer ended the call (see README).
    # `voice` becomes Rime's `speaker`, `language` its `lang`. Coda with the
    # speaker vashti, which Rime's catalogue lists for coda as a British (GB,
    # English) voice; Mist v3 lists no British speaker.
    tts:
      name: engines.rime_idle.RimeTTSReconnectOnIdle
      language_map:
        en:
          voice: vashti
          language: en
      model_id: coda
  inspector:
    enabled: true
    interruptions:
      enabled: false
    asr:
      name: deepgram
      language_map:
        en:
          model: flux-general-en
    tts:
      name: engines.rime_idle.RimeTTSReconnectOnIdle
      language_map:
        en:
          voice: vashti
          language: en
      model_id: coda
