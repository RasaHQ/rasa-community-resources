[project]
name = "mantle-voice-banking-advisor-appointment-claude"
version = "0.1.0"
description = "Northgate Bank advisor-appointment voice agent on Claude Sonnet 5.5 with Deepgram Flux and Rime speech, the booking guard enforced in the tool layer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5"]

[tool.rasa-catalog]
required-secrets = ["ANTHROPIC_API_KEY", "DEEPGRAM_API_KEY", "RIME_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
