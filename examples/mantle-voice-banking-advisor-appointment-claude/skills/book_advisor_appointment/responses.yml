# The case's confirmation question: "This team handles your stated request by
# phone at the available time. Would that work for you?" There is no
# utter_on_user_denial on purpose: with one set, a correction made at this
# question is answered only by the canned denial line (found in the GPT and
# Claude text builds).
responses:
  utter_confirm_booking:
    - text: >
        {held_team_label} handles {held_purpose_label}, {held_slot_label}. I have
        held that time for you. Would that work for you?
