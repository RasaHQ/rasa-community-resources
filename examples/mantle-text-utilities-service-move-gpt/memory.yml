# Project-wide memory (session.project.*). Written once by
# load_customer_profile at session start, never by the model. One short field
# per value: Mantle cuts a memory value at 100 characters in the prompt,
# silently; tests/test_guard.py checks these.
customer_id:
  type: text
  # Customer id of the signed-in customer this session is bound to.
customer_first_name:
  type: text
  # Customer's first name, for greeting.
service_list:
  type: text
  # The customer's own current services, id and address, separated by semicolons.
today:
  type: text
  # Today's date at Amber Grid (the fixture clock), YYYY-MM-DD.
