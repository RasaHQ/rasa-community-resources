[project]
name = "mantle-text-utilities-service-move-gpt"
version = "0.1.0"
description = "Amber Grid home moves in web chat, on GPT-5.5: a move is scheduled for the customer's dates and the current service stays on until then"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5"]

[tool.rasa-catalog]
required-secrets = ["OPENAI_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
