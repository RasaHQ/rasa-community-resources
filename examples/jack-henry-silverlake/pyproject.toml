[project]
name = "jack-henry-silverlake-demo"
version = "0.1.0"
description = "Fictional SilverLake banking conversations on the learner-downloaded jXchange SOAP contracts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "rasa-pro==3.21.0.dev5",
  "mcp>=1.28.1,<2",
  "xmlschema>=3.4,<5",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
]

[tool.rasa-catalog]
license-secret = "RASA_LICENSE"
required-secrets = ["OPENAI_API_KEY", "DEEPGRAM_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
