[project]
name = "mantle-text-reminder-deduplication-gpt"
version = "0.1.0"
description = "Cedar Clinic appointment reminders by SMS, on GPT-5.5: one reminder per booking version, to a confirmed number, with delivery kept apart from attendance"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5"]

[tool.rasa-catalog]
required-secrets = ["OPENAI_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
