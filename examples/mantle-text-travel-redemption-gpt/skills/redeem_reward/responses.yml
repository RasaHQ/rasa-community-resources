responses:
  utter_confirm_redemption:
    - text: >
        Before I complete this: {held_points} points will come from account
        {held_account} for {held_reward_label}, held for you under
        {held_hold_id}. Shall I redeem it?
  utter_redemption_not_confirmed:
    - text: >
        Okay, I have not redeemed anything and no points were taken. The reward
        is still held.
