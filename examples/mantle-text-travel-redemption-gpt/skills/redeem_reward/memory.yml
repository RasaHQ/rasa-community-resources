# Written only by hold_reward, release_hold and redeem_reward (never
# llm_settable), so the reward and points the engine asks the member to confirm
# are always the hold the tool made.
# held_hold_id: the active hold; redeem_reward is withheld while it is empty.
# held_reward_label: the held reward, read in the confirmation question.
# held_points: the held points, formatted, read in the confirmation question.
# held_account: the account the held points come from.
schema:
  public:
    held_hold_id:
      type: text
    held_reward_label:
      type: text
    held_points:
      type: text
    held_account:
      type: text
