[project]
name = "mantle-text-travel-redemption-gpt"
version = "0.1.0"
description = "Horizon Rewards redemption in web chat, on GPT-5.5, with points, held inventory and the booking reconciled in the tool layer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5"]

[tool.rasa-catalog]
required-secrets = ["OPENAI_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
