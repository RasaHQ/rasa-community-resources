# Project-wide memory (session.project.*). Written by load_member_profile at
# session start, never by the model. Project fields are write-once.
member_id:
  type: text
  description: Horizon Rewards member id this web-chat session is signed in as.
member_first_name:
  type: text
  description: Member's first name, for greeting.
rewards_account:
  type: text
  description: The member's own verified Horizon Rewards account number.
