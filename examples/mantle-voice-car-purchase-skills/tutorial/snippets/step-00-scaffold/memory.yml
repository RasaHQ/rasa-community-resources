# Project-wide memory shared across skills (session.project.*)
username:
  type: text
  # Demo customer display name used by the Rasa Motors tools.
  initial_value: Alex Rivera
segment:
  type: text
  # Customer segment (Retail, Fleet, SME).
  initial_value: Retail
email_address:
  type: text
  # Customer email on file.
physical_address:
  type: text
  # Customer mailing address on file.
car_model:
  type: text
  # Car model the customer has reserved or is buying.
car_price:
  type: float
  # Advertised price of the car the customer is buying.
dealer_name:
  type: text
  # Rasa Motors dealer holding the customer's car.
