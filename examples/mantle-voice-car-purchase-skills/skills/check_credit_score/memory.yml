schema:
  public:
    full_name:
      type: text
      description: Customer's full legal name for the identity check.
      llm_settable: true
    ssn_last_four:
      type: text
      description: Last four digits of the customer's social security number.
      llm_settable: true
    date_of_birth:
      type: text
      description: Customer's date of birth in YYYY-MM-DD.
      llm_settable: true
    identity_verified:
      type: bool
    credit_score:
      type: int
    credit_band:
      type: text
