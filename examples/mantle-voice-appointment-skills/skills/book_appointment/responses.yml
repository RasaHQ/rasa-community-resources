responses:
  utter_privacy_notice:
    - text: >
        Before we book, a quick note — this call may be recorded for quality and
        training, and your appointment details are stored on your clinic record.
  utter_urgent_notice:
    - text: >
        If this is a medical emergency, please hang up and call the emergency
        services now.
  utter_confirm_booking:
    - text: >
        Just to confirm — shall I book {selected_slot_spoken}?
  utter_booking_cancelled:
    - text: Okay, I have not booked anything. Would you like to look at other times?
  utter_booking_complete:
    - text: >
        You're booked for {selected_slot_spoken}. Your reference is
        {booking_reference}, and we'll send a reminder the day before.
