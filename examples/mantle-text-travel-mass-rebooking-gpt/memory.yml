# Project-wide memory (session.project.*). Written by load_passenger_profile at
# session start, never by the model. Project fields are write-once. One short
# field per value (Mantle cuts a memory value at 100 characters in the prompt).
passenger_id:
  type: text
  description: Horizon Travel passenger id this web-chat session is signed in as.
passenger_first_name:
  type: text
  description: Passenger's first name, for greeting.
disruption_case:
  type: text
  description: The passenger's own storm disruption case reference.
