[project]
name = "mantle-text-travel-mass-rebooking-gpt"
version = "0.1.0"
description = "Horizon Travel storm rebooking in web chat, on GPT-5.5, with an offer, a capacity hold and a committed replacement kept apart in the tool layer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5"]

[tool.rasa-catalog]
required-secrets = ["OPENAI_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
