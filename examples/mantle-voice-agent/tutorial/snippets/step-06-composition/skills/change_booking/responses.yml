responses:
  utter_confirm_cancel_booking:
    - text: >
        Just to confirm, I will cancel {session.project.selected_trip_name},
        booking {session.project.selected_booking_ref}. This cannot be undone.
        Shall I go ahead?
  utter_cancel_aborted:
    - text: Okay, I have left that booking exactly as it was.
  utter_booking_cancelled:
    - text: >
        That booking is now cancelled. Any refund due will go back to your
        original payment method within seven business days.
