# Vendored from patterns/voice-vendor-router at commit 730b61da7adbbd4b212718e0d40c00490fd6c201; keep in sync.
# Same package, code and dependencies as the pattern. Only the pattern's
# [dependency-groups] and [tool.uv] tables are left out: they install Rasa
# when the pattern itself is the project, and uv ignores them for a
# dependency. The example that holds this copy pins Rasa itself.
[project]
name = "voice-vendor-router"
version = "0.1.0"
description = "Shared ASR/TTS routing with optional Rasa integration: failover and health"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiohttp>=3.9",
    "websockets>=15",
    "pydantic>=2.10,<3",
    "structlog>=24",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]

# NeuTTS is deliberately NOT declared as an optional dependency here.
#
# rasa-pro pins numpy>=2.1.3,<2.2.0; neutts requires numpy>=2.2.6. There is no
# resolution that satisfies both, so declaring the extra makes `uv sync` fail
# for everyone — including CI — whether or not they want local TTS.
#
# The adapter still ships and is skipped with a clear reason until neutts is
# importable. See the README for the two ways to actually run it.

# Open-source ASR. Unlike NeuTTS these resolve cleanly against rasa-pro's numpy
# pin on Python 3.12 (numpy 2.1.3 satisfies both), so they are a real extra:
#   uv sync --extra local-asr
[project.optional-dependencies]
aws = [
    "boto3>=1.34",
    "amazon-transcribe>=0.6.2",
]
google = [
    "google-cloud-texttospeech>=2.16",
    "google-cloud-speech>=2.26",
]
local-asr = [
    # Pinned, not floated: vosk 0.3.45 publishes no macOS arm64 wheel — only
    # manylinux and win_amd64 — so a float breaks the extra outright on Apple
    # Silicon. 0.3.44 has the wheel and is what this resource is verified on.
    "vosk==0.3.44",
    "faster-whisper>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicerouter"]
