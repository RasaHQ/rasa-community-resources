[project]
name = "vela-voice-routed"
version = "0.1.0"
description = "Voice banking agent on Rasa Mantle whose ASR and TTS are routed across vendors"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rasa-pro==3.21.0.dev5",
    # The router itself: a copy of patterns/voice-vendor-router kept in
    # vendor/voice-vendor-router, installed as a real package so this example
    # installs and runs from its own folder.
    "voice-vendor-router",
]

# A path source inside this example: vendor/voice-vendor-router is a copy of
# patterns/voice-vendor-router (its README names the commit), so this folder
# works on its own.
[tool.uv.sources]
voice-vendor-router = { path = "vendor/voice-vendor-router", editable = true }

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
