[project]
name = "vela-voice-routed"
version = "0.1.0"
description = "Voice banking agent on Rasa Mantle whose ASR and TTS are routed across vendors"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rasa-pro==3.20.0.dev6",
    # The router itself. It is a real package, not a copied-in file, so this
    # example and the pattern cannot drift apart.
    "voice-vendor-router",
]

# A path source, because the router lives in this repository. If you lift this
# directory out on its own, replace it with a git source:
#
#   [tool.uv.sources]
#   voice-vendor-router = { git = "https://github.com/RasaHQ/rasa-community-resources", subdirectory = "patterns/voice-vendor-router" }
[tool.uv.sources]
voice-vendor-router = { path = "../../patterns/voice-vendor-router", editable = true }

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
