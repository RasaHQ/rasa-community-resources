[project]
name = "mantle-voice-banking-collections-gemini"
version = "0.1.0"
description = "Willow Shop order-status voice agent on Gemini 3.8 Flash with Deepgram and Rime speech, the milestone guard enforced in the tool layer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5"]

[tool.rasa-catalog]
required-secrets = ["GEMINI_API_KEY", "DEEPGRAM_API_KEY", "RIME_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
