# Project-wide memory (session.project.*). Written by load_session_customer at
# session start, never by the model.
customer_id:
  type: text
  # Customer id of the signed-in customer this session is bound to.
customer_first_name:
  type: text
  # Signed-in customer's first name, for greeting.
account_list:
  type: text
  # The customer's past-due accounts by product and last four digits.
