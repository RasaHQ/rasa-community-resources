# The engine's read-back before record_plan_choice runs. There is no
# utter_on_user_denial on purpose: with one set, a correction made at this
# question is answered only by the canned denial line (found in the GPT and
# Claude text builds).
responses:
  utter_confirm_plan:
    - text: >
        Para su {plan_account_label}: {plan_terms_label}, el primero el
        {plan_first_due_label}. Elegir un plan no es un pago. ¿Confirma que
        quiere este plan?
