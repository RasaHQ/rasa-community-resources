# External integrations for the HarborCover quote-and-bind agent.
#
# The orchestrator LLM is a model-group reference. Rasa's OpenAI client sends
# gpt-5.5-2026-04-23 through LiteLLM. reasoning_effort is set to low rather
# than Rasa's default for this model (none, `_apply_default_reasoning_effort`
# in rasa/shared/utils/llm.py). In the Northgate block-card build
# (examples/mantle-voice-banking-block-card-gpt), at none GPT-5.5 twice wrote
# a tool call out as text that reached the caller and twice announced an
# action without taking it; at low it did neither, for about 0.1 s more at the
# median. This agent's whole job is a sequence of gated tool calls, so a
# spoken tool call or an announced-but-skipped bind would be the failure the
# case is about. The `reasoning-default` variant in
# case-build/conversations.json removes this line.
llm:
  model_group: orchestrator

model_groups:
  - id: orchestrator
    models:
      - provider: openai
        model: gpt-5.5-2026-04-23
        api_key: ${OPENAI_API_KEY}
        reasoning_effort: low

# Mantle reads channels from here, never from credentials.yml.
# `rest` is the web-chat HTTP endpoint (/webhooks/rest/webhook) the build
# harness drives; `socketio` is what a browser chat widget connects to;
# `inspector` serves `rasa inspect`.
channels:
  rest:
    enabled: true
  socketio:
    enabled: true
    user_message_evt: user_uttered
    bot_message_evt: bot_uttered
    session_persistence: true
  inspector:
    enabled: true
