# Written only by the quote tools (never llm_settable), so what the engine
# reads back at each confirmation is what the services hold.
# quote_id: the quote the last read or change was about.
# answers_summary: its material answers, read back by confirm_material_answers.
# answers_hash: the hash of those answers; the confirmation records it.
# offer_id: the quote's current underwritten offer, or empty.
# offer_summary: that offer, read back by bind_offer.
schema:
  public:
    quote_id:
      type: text
    answers_summary:
      type: text
    answers_hash:
      type: text
    offer_id:
      type: text
    offer_summary:
      type: text
