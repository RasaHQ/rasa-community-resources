responses:
  utter_confirm_material_answers:
    - text: >
        Please check the answers this quote is underwritten on: {answers_summary}.
        Are all of these correct?
  utter_answers_not_confirmed:
    - text: Okay, nothing is confirmed. Which answer should I change?
  utter_confirm_bind_offer:
    - text: >
        {offer_summary} This is an offer, not active cover yet. Shall I ask the
        HarborCover binding service to bind it now?
  utter_bind_not_requested:
    - text: Okay, I have not asked to bind it. The offer is not active cover.
