# Project-wide memory (session.project.*). Written once by load_caller_profile
# at session start, never by the model.
customer_id:
  type: text
  description: Customer id of the signed-in customer this session is bound to.
customer_first_name:
  type: text
  description: Customer's first name, for greeting.
saved_quotes:
  type: text
  description: The customer's saved quotes, as quote id and product (kept under Mantle's 100-character prompt cap).
