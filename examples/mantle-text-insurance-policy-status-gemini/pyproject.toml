[project]
name = "mantle-text-insurance-policy-status-gemini"
version = "0.1.0"
description = "HarborCover policy and claim status in web chat, on Gemini, with the coverage guard enforced in the tool layer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5"]

[tool.rasa-catalog]
required-secrets = ["GEMINI_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
