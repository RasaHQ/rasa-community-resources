# Project-wide memory (session.project.*). Written by load_caller_profile at
# session start, never by the model.
customer_id:
  type: text
  description: Customer id of the caller this session is bound to.
customer_first_name:
  type: text
  description: Caller's first name, for greeting.
policy_numbers:
  type: text
  description: Comma-separated policy numbers on the caller's account.
claim_numbers:
  type: text
  description: Comma-separated claim numbers on the caller's account.
