[project]
name = "shop-native-assistant"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rasa-pro==3.21.0.dev5",
    "mcp==1.28.1",
    "pydantic==2.13.5",
    "zeocore==0.53.5",
    "zeo-integrations @ git+https://github.com/zeroemployeeorg/zeointegrations.git@3a5c24db7111935b44e6fe6752ef57e1404debbc",
]

[dependency-groups]
# Catalog discovery runs every test module in this locked native environment.
# The sign-in controls exercise the same SDK installed by the consent project.
dev = ["google-auth-oauthlib>=1.2,<2"]

[tool.uv]
prerelease = "allow"
package = false

[tool.rasa-catalog]
test-workers = ["server"]
license-secret = "RASA_PRO_LICENSE"
secret-setup = "personal"
forward-ports = []
required-secrets = ["OPENAI_API_KEY", "TELEGRAM_BOT_TOKEN", "GOOGLE_TOKEN_JSON", "SHOP_SHEET_ID", "SHOP_OPERATOR_CHAT_ID"]
