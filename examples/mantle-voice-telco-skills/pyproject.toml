[project]
name = "telano-voice-telco"
version = "0.1.0"
description = "Build-with-me tutorial: voice telecom care agent with Rasa Skills + Deepgram"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "rasa-pro==3.20.0.dev1",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
