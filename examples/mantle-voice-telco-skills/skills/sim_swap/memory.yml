schema:
  public:
    swap_target_line:
      type: text
      description: >
        The customer's mobile line they want moved to a new SIM, such as
        555-0142. Change it only when the customer names a different line.
      llm_settable: true
    swap_verification:
      type: text
    swap_code_attempts:
      type: float
    swap_locked_out:
      type: bool
    swap_reference:
      type: text
    swap_status:
      type: text
    swap_call_started_at:
      type: text
