# External integrations for the Northgate risk step-up web chat agent.
#
# The orchestrator LLM is a model-group reference. Rasa's OpenAI client sends
# gpt-5.5-2026-04-23 through LiteLLM. reasoning_effort is set to low rather
# than Rasa's default for this model (none, applied by
# rasa/shared/utils/llm.py when a project sets nothing). In the Northgate
# block-card build, at none GPT-5.5 sometimes wrote its tool calls out as text
# (which Mantle sends to the user) or announced an action and ended the turn
# without taking it: 4 times at none, 0 at low, for about 0.1 s more at the
# median. This agent's whole job is to take the right tool call at the right
# time, so a spoken-instead-of-taken call would be a false "sent". The
# `reasoning-default` variant in case-build/conversations.json removes this
# line.
llm:
  model_group: orchestrator

model_groups:
  - id: orchestrator
    models:
      - provider: openai
        model: gpt-5.5-2026-04-23
        api_key: ${OPENAI_API_KEY}
        reasoning_effort: low

# Mantle reads channels from here, never from credentials.yml.
# `rest` is the web-chat HTTP endpoint (/webhooks/rest/webhook) the build
# harness drives; `socketio` is what a browser chat widget connects to;
# `inspector` serves `rasa inspect`.
channels:
  rest:
    enabled: true
  socketio:
    enabled: true
    user_message_evt: user_uttered
    bot_message_evt: bot_uttered
    session_persistence: true
  inspector:
    enabled: true
