# Project-wide memory (session.project.*). Written by load_caller_profile at
# session start, never by the model.
customer_id:
  type: text
  description: Customer id of the signed-in customer this session is bound to.
customer_first_name:
  type: text
  description: Customer's first name, for greeting.
accounts:
  type: text
  description: The customer's accounts, label and id.
payees:
  type: text
  description: The customer's saved payees, nickname and id.
