# Project-wide memory (session.project.*). Written by load_session_passenger at
# session start, never by the model. One short field per value: Mantle cuts a
# memory value at 100 characters in the prompt, silently.
passenger_id:
  type: text
  description: Passenger id of the signed-in passenger this session is bound to.
passenger_first_name:
  type: text
  description: Signed-in passenger's first name, for greeting.
affected_trips:
  type: text
  description: The passenger's cancelled bookings, as destination city and booking reference.
