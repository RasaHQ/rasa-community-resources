responses:
  # The contract's question, with the selected option read from memory. There
  # is no utter_on_user_denial: a correction at this question is answered in
  # the same turn (found in the Willow Shop returns build).
  utter_confirm_hold:
    - text: >
        Options are changing during the disruption. Shall I try to hold
        {selected_option_summary}? A hold keeps a seat until it expires; it
        is not a confirmed journey, and I can't promise a seat until the hold
        is placed.
