# External integrations for the Horizon Travel disruption agent.
#
# The orchestrator LLM is a model-group reference. Rasa's OpenAI client sends
# gpt-5.5-2026-04-23 through LiteLLM.
#
# reasoning_effort is set to low rather than Rasa's default for this model,
# which is none (rasa/shared/utils/llm.py, _apply_default_reasoning_effort).
# In the Northgate block-card build (examples/mantle-voice-banking-block-card-gpt),
# at none GPT-5.5 wrote tool calls out as text that Mantle sent to the caller,
# and announced actions it then did not take; at low, on the same calls, it
# did neither. An agent that says "I've held that seat for you" without
# calling hold_recovery_option makes exactly the unbacked promise this case is
# about, so this build starts at low. The `reasoning-default` variant in
# case-build/conversations.json removes this line.
llm:
  model_group: orchestrator

model_groups:
  - id: orchestrator
    models:
      - provider: openai
        model: gpt-5.5-2026-04-23
        api_key: ${OPENAI_API_KEY}
        reasoning_effort: low

# Mantle reads channels from here, never from credentials.yml.
# `rest` is the web-chat HTTP endpoint (/webhooks/rest/webhook) the build
# harness drives; `socketio` is what a browser chat widget connects to;
# `inspector` serves `rasa inspect`.
channels:
  rest:
    enabled: true
  socketio:
    enabled: true
    user_message_evt: user_uttered
    bot_message_evt: bot_uttered
    session_persistence: true
  inspector:
    enabled: true
