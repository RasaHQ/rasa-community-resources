[project]
name = "samrudh-gemini-voice-agent"
version = "0.1.0"
description = "Atlas voice travel agent running on Google Gemini with local embeddings"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rasa-pro==3.20.0rc1",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=5.7.0",
]

# Gemini authenticates runtime conversations. Training builds local embeddings
# and needs an issued Rasa licence, but does not call Gemini (verified on dev9).
[tool.rasa-catalog]
required-secrets = ["GEMINI_API_KEY"]
training-secrets = []

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
