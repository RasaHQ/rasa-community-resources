[project]
name = "samrudh-gemini-voice-agent"
version = "0.1.0"
description = "Atlas voice travel agent running on Google Gemini with local embeddings"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rasa-pro==3.21.0.dev5",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=5.7.0",
    "torch==2.14.0; sys_platform == 'linux'",
]

# Gemini authenticates runtime conversations. Training builds local embeddings
# and needs an issued Rasa licence, but does not call Gemini (verified on dev9).
[tool.rasa-catalog]
required-secrets = ["GEMINI_API_KEY"]
# 3.21 expands api_key: ${GEMINI_API_KEY} at train time, so the variable must
# exist to train; training itself makes no Gemini call.
training-secrets = ["GEMINI_API_KEY"]

[tool.uv]
prerelease = "allow"

# Local embeddings do not need CUDA. Keep Linux installs on the explicit CPU
# index; macOS and Windows retain their existing PyPI selection.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
