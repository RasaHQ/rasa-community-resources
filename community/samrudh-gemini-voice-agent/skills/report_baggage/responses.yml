responses:
  utter_baggage_recording_notice:
    - text: >
        This call may be recorded for quality assurance and training purposes.
  utter_baggage_stolen_warning:
    - text: >
        For your protection, we will flag this as a possible theft and share
        details with airport security if needed.
  utter_confirm_baggage_report:
    - text: >
        I am ready to file this report for booking
        {session.report_baggage.booking_ref}. Shall I submit it?
  utter_baggage_report_cancelled:
    - text: Okay, I have not filed that report yet. Tell me what to change.
  utter_baggage_submitted:
    - text: >
        Your baggage report has been filed. Keep your report reference handy
        when you speak with the baggage desk.
