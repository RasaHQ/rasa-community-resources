version: "3.1"
responses:
  utter_ask_confirm_restart:
    - text: "I can restart your router now. Your internet will drop for a short time, and your Wi-Fi name and password stay the same. Shall I go ahead?"
  utter_restart_declined:
    - text: "No problem. I have not sent anything to your router."
  utter_restart_sent:
    - text: "Done. I sent a restart (REBOOT). Your Wi-Fi name and password are kept."
slots:
  command_sent:
    type: "text"
    mappings:
      - type: "from_llm"
  confirm_restart:
    type: "bool"
    mappings:
      - type: "from_llm"
  reset_kind:
    type: "text"
    mappings:
      - type: "from_llm"
