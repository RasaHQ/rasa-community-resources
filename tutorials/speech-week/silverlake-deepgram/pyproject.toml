[project]
name = "speech-week-silverlake-deepgram"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["rasa-pro==3.22.0rc1", "mcp>=1.28.1,<2", "xmlschema>=3.4,<5", "xsdata==26.10", "httpx>=0.27,<1", "uvicorn>=0.30,<1", "python-dotenv>=1,<2"]

[tool.uv]
package = false
prerelease = "allow"

[tool.rasa-catalog]
release-version = "3.22.0rc1"
license-secret = "RASA_PRO_LICENSE"
secret-setup = "personal"
required-secrets = ["OPENAI_API_KEY", "DEEPGRAM_API_KEY"]
forward-ports = [5005]
