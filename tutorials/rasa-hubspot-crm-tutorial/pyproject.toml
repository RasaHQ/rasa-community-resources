[project]
name = "meridian-hubspot-support"
version = "0.1.0"
description = "Tutorial: connect a Rasa Mantle agent to HubSpot CRM over REST"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rasa-pro==3.20.0.dev1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
