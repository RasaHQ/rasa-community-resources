# Project memory — who the caller is, shared by every skill.
#
# The CRM is the source of truth; these are the identifiers we resolved once so
# later skills do not have to ask again or look them up twice.
contact_email:
  type: text
  # Email the caller gave us, used to find them in HubSpot.
contact_id:
  type: text
  # HubSpot contact id, set once the caller is found.
contact_name:
  type: text
  # Customer name as recorded in HubSpot.
