[project]
name = "rasa-document-artifact-tutorial"
version = "0.1.0"
description = "Tutorial: the conversation edits structured state and the document is DERIVED from it — the model can never write the artifact"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rasa-pro==3.20.0.dev6",
]

[tool.uv]
prerelease = "allow"
package = false

[tool.rasa-catalog]
required-secrets = ["RASA_LICENSE", "OPENAI_API_KEY"]
