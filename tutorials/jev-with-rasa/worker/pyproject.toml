[project]
name = "jacaranda-jev-worker"
version = "0.1.0"
description = "Bounded Jev account selection using the public TypeSafe SDK"
requires-python = ">=3.12,<3.13"
dependencies = ["typesafe-sdk==0.7.4"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jacaranda_jev"]
