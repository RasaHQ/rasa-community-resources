[project]
name = "willowshop-agno-adviser"
version = "0.1.0"
description = "Keep an Agno product adviser and distinguish customer memory from conversation history"
requires-python = ">=3.12,<3.13"
dependencies = ["agno==3.1.2", "sqlalchemy==2.0.54", "openai>=2.44.0,<2.55.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shop_adviser"]
