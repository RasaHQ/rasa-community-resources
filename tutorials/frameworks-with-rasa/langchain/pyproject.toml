[project]
name = "jacaranda-policy-langchain-worker"
version = "0.1.0"
description = "Retain LangChain retrieval and preserve exact citations through a conversation handoff"
requires-python = ">=3.12,<3.13"
dependencies = ["langchain-core==1.6.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["policy_worker"]
