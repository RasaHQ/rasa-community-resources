[project]
name = "jacaranda-statement-langgraph-worker"
version = "0.1.0"
description = "Keep a paused LangGraph statement search behind a Rasa conversation"
requires-python = ">=3.12,<3.13"
dependencies = ["langgraph==1.2.12", "langgraph-checkpoint-sqlite==3.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["statement_worker"]
