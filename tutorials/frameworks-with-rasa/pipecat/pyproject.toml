[project]
name = "juniper-pipecat-conversation"
version = "0.1.0"
description = "Keep a Pipecat speech pipeline and let Rasa own the customer dialogue"
requires-python = ">=3.12,<3.13"
dependencies = ["pipecat-ai==1.12.0", "aiohttp==3.13.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rasa_dialogue"]
