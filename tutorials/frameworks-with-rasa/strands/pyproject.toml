[project]
name = "juniper-strands-network-tools"
version = "0.1.0"
description = "Retain Strands read-only network tools without sharing caller conversation history"
requires-python = ">=3.12,<3.13"
dependencies = ["strands-agents==1.57.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["network_specialist"]
