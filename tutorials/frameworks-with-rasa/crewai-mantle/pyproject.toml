[project]
name = "harborcover-crew-conversation"
version = "0.1.0"
description = "A Rasa conversation exposing an existing native claim-research crew"
requires-python = ">=3.12,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5", "harborcover-crew-transport"]

[tool.rasa-catalog]
required-secrets = ["OPENAI_API_KEY"]
test-workers = ["../crewai"]

[tool.uv]
prerelease = "allow"
package = false

[tool.uv.sources]
harborcover-crew-transport = { path = "../crewai-transport", editable = true }
