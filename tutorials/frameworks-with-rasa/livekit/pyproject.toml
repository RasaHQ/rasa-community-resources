[project]
name = "juniper-livekit-conversation"
version = "0.1.0"
description = "Keep LiveKit media and bind each public room conversation to Rasa"
requires-python = ">=3.12,<3.13"
dependencies = ["livekit-agents==1.8.6", "aiohttp==3.13.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rasa_room"]
