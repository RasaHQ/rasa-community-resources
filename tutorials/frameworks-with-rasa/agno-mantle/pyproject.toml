[project]
name = "willowshop-agno-conversation"
version = "0.1.0"
description = "Expose an existing Agno product adviser through a Rasa conversation"
requires-python = ">=3.12,<3.13"
dependencies = ["rasa-pro==3.21.0.dev5", "willowshop-agno-adviser"]

[tool.rasa-catalog]
required-secrets = ["OPENAI_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false

[tool.uv.sources]
willowshop-agno-adviser = { path = "../agno", editable = true }
