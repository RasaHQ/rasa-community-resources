[project]
name = "mantle-langgraph-comparison"
version = "0.1.0"
description = "Tutorial: LangGraph's customer-support bot, rebuilt in Rasa Mantle"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rasa-pro==3.20.0.dev6",
    "python-dotenv>=1.0.0",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
