schema:
  public:
    city:
      type: text
      description: >
        City this booking is for, e.g. Basel. Set it as soon as you know it.
      llm_settable: true
    selected_hotel_id:
      type: int
      description: >
        Id of the hotel the traveller chose. Only ever a value that appeared
        in the search results.
      llm_settable: true
