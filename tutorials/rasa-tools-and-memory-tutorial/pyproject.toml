[project]
name = "meridian-tools-and-memory"
version = "0.1.0"
description = "Tutorial: local vs global tools and memory scoping in Rasa Mantle"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rasa-pro==3.19.0.dev7",
    "python-dotenv>=1.0.0",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
