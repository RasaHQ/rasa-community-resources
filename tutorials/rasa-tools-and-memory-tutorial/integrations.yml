# The tutorial is text-first on purpose: the teaching points are tool scope and
# memory scope, so it needs one LLM key and nothing else.

# The orchestrator LLM is a model-group reference. Provider, model and
# credentials live on the named group, never inline under `llm:` — the
# inline form was removed in rasa-pro 3.20.0.dev6.
llm:
  model_group: orchestrator

model_groups:
  - id: orchestrator
    models:
      - provider: openai
        model: gpt-4.1-mini
        api_key_env: OPENAI_API_KEY
        temperature: 0.0

channels:
  rest:
    enabled: true
  inspector:
    enabled: true
