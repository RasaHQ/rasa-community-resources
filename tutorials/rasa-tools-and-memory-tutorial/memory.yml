# Project memory — the facts that outlive a single skill.
#
# Project fields are shared across skills; the pinned runtime refuses a second
# write after a value is set. Sharing these facts is what lets a
# later skill skip work an earlier skill already did. Keep it to facts about
# the end user and the session, not to one skill's working state.
authenticated:
  type: bool
  description: Whether the caller has proven their identity this session.
customer_id:
  type: text
  description: Meridian customer id, set once identity is proven.
preferred_language:
  type: text
  description: Language the customer asked to be served in.
  initial_value: en
