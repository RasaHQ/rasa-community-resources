responses:
  utter_greet:
    - text: >
        Hello. I'm Atlas, your Horizon Travel voice assistant.
        I can help you check your itinerary, look up flight status,
        change a booking, or report lost baggage.
        What would you like to do?
      metadata:
        rephrase: true
  utter_fallback:
    - text: >
        I'm here to help with itineraries, flight status, booking changes,
        and baggage reports. What would you like to do?
  utter_bot_challenge:
    - text: >
        Yes, I'm Atlas, an AI assistant for Horizon Travel.
        I can still help with your trip, or connect you to a human.
  utter_can_do_something_else:
    - text: Is there anything else I can help you with today?
