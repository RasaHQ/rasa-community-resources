# External integrations for the Atlas voice travel agent.

# Option 1: OpenAI (Default)
llm:
  provider: openai
  model: gpt-4.1-mini
  api_key_env: OPENAI_API_KEY
  temperature: 0.0

# Option 2: Google Gemini (Alternative)
# llm:
#   provider: gemini
#   model: gemini-2.5-flash
#   api_key_env: GEMINI_API_KEY
#   temperature: 0.0

model_groups:
  - id: local-embeddings
    models:
      - provider: huggingface_local
        model: sentence-transformers/all-MiniLM-L6-v2

channels:
  rest:
    enabled: true
  inspector:
    enabled: true
    # Deepgram end-to-end: speech-to-text (ASR) and text-to-speech (TTS)
    asr:
      name: deepgram
      language_map:
        en:
          model: flux-general-en
      eot_threshold: 0.7
      eot_timeout_ms: 5000
    tts:
      name: deepgram
      language_map:
        en:
          model: aura-2-andromeda-en
