# External integrations for the Atlas voice travel agent.

llm:
  provider: openai
  model: gpt-4.1-mini
  api_key_env: OPENAI_API_KEY
  temperature: 0.0

channels:
  rest:
    enabled: true
  inspector:
    enabled: true
    # Deepgram end-to-end: speech-to-text (ASR) and text-to-speech (TTS)
    asr:
      name: deepgram
      language_map:
        en:
          model: flux-general-en
      eot_threshold: 0.7
      eot_timeout_ms: 5000
    tts:
      name: deepgram
      language_map:
        en:
          model: aura-2-andromeda-en
