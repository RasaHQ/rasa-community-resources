# concern: ops
[project]
name = "cedar-clinic-livekit"
version = "0.1.0"
description = "Cedar Clinic on the open-source LiveKit Agents session"
requires-python = ">=3.11,<3.13"
dependencies = ["livekit-agents==1.8.4", "livekit-plugins-openai==1.8.4", "starlette>=0.47", "uvicorn>=0.35", "cedar-clinic", "cedar-speech"]
[tool.uv.sources]
cedar-clinic = { path = "../shared/clinic", editable = true }
cedar-speech = { path = "../shared/speech", editable = true }
[tool.uv]
package = false
[dependency-groups]
dev = ["httpx>=0.27"]
