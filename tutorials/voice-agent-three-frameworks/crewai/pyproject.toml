# concern: ops
[project]
name = "cedar-clinic-crewai"
version = "0.1.0"
description = "Cedar Clinic on the open-source CrewAI single-agent API"
requires-python = ">=3.11,<3.13"
dependencies = ["crewai==1.15.23", "starlette>=0.47", "uvicorn>=0.35", "cedar-clinic", "cedar-speech"]
[tool.uv.sources]
voice-vendor-router = { path = "../../../patterns/voice-vendor-router", editable = true }
cedar-clinic = { path = "../shared/clinic", editable = true }
cedar-speech = { path = "../shared/speech", editable = true }
[tool.uv]
package = false
[dependency-groups]
dev = ["httpx>=0.27"]
