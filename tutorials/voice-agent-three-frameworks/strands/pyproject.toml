# concern: ops
[project]
name = "voice-agent-three-frameworks-strands"
version = "0.1.0"
description = "Cedar Clinic refill-request voice agent on AWS Strands Agents, one of three builds of the same agent: GPT-5.5, Speechmatics speech in and out, the refill guard as a Strands intervention"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "strands-agents[openai]==1.57.1",
    "starlette>=0.40",
    "uvicorn>=0.30",
    # The shared parts, the same packages the other versions install.
    "cedar-clinic",
    "cedar-speech",
]

[tool.uv.sources]
voice-vendor-router = { path = "../../../patterns/voice-vendor-router", editable = true }
cedar-clinic = { path = "../shared/clinic", editable = true }
cedar-speech = { path = "../shared/speech", editable = true }

[tool.uv]
package = false

[dependency-groups]
# Starlette's TestClient, for the offline protocol test.
dev = ["httpx>=0.27"]
