[project]
name = "cedar-clinic"
version = "0.1.0"
description = "Fictional Cedar Clinic refill-request domain shared by the Rasa, LangGraph and Strands voice agents: records, rules, audited tool functions. No framework imports, no dependencies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cedar_clinic"]
