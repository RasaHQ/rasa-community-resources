[project]
name = "rasa-card-reissue-tutorial"
version = "0.1.0"
description = "Tutorial: guarding an irreversible action — card reissue with address provenance and an execution-time guard"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rasa-pro==3.20.0.dev6",
]

[tool.rasa-catalog]
required-secrets = ["OPENAI_API_KEY", "DEEPGRAM_API_KEY"]

[tool.uv]
prerelease = "allow"
package = false
