[project]
name = "elarbib-terra-energy"
version = "0.1.0"
description = "Solar & wind site potential assessment via NASA POWER data — site analysis, site comparison and data-source health, in a voice + text agent with a FastAPI backend."
requires-python = ">=3.11,<3.14"
dependencies = ["rasa-pro==3.19.0.dev6"]

[tool.uv]
prerelease = "allow"

[tool.rasa-catalog]
required-secrets = ["RASA_LICENSE", "MISTRAL_API_KEY", "NEUPHONIC_API_KEY", "NSRDB_API_KEY", "CDS_API_KEY"]
