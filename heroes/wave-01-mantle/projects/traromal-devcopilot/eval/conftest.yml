# Eval harness LLM config for DevPilot.
# Simulator plays the developer; judge scores criteria + quality.
# Same OpenAI-compatible DeepSeek setup as integrations.yml.
simulation:
  llm:
    provider: openai
    model: deepseek-chat
    api_key_env: OPENAI_API_KEY
    api_base: https://api.deepseek.com
    temperature: 0.7

evaluation:
  llm:
    provider: openai
    model: deepseek-chat
    api_key_env: OPENAI_API_KEY
    api_base: https://api.deepseek.com
    temperature: 0.0
  criteria_judge_prompt: null
  metrics_judge_prompt: null