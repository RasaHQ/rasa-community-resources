responses:
  utter_greet:
    - text: >
        Hi! I'm DevPilot, your voice assistant for developers. I can check
        your assigned tasks, update tickets, file incident reports, order
        hardware, or escalate an issue. What can I help you with?
      metadata:
        rephrase: true
  utter_fallback:
    - text: >
        I can help with tasks, tickets, incident reports, hardware orders,
        and escalations. What would you like to do?
  utter_bot_challenge:
    - text: >
        Yes, I'm DevPilot, a voice assistant for developers. I can help
        with your tasks, or connect you to the on-call engineer.
  utter_can_do_something_else:
    - text: Is there anything else I can help you with today?
