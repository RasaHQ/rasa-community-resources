tech_id:
  type: text
  description: Active developer id for tool calls.
  initial_value: "101"
tech_first_name:
  type: text
  description: Developer first name used in greetings.
  initial_value: Alex
tech_last_name:
  type: text
  description: Developer last name on file.
  initial_value: Chen
authenticated:
  type: bool
  description: Whether the developer has completed badge authentication.
  initial_value: false
selected_job_ref:
  type: text
  description: Task reference the developer has selected for this request.
selected_project:
  type: text
  description: Project or repo name for the selected task.
user_timezone:
  type: text
  description: Preferred timezone for dates, reminders, and spoken times.
  initial_value: Asia/Calcutta
response_style:
  type: categorical
  enum_values: [brief, normal, detailed]
  description: Preferred amount of detail in assistant responses.
  initial_value: brief
preferred_slack_channel:
  type: text
  description: Default Slack channel for explicitly requested posts.
  initial_value: all-devcopilot
notification_mode:
  type: categorical
  enum_values: [quiet, normal, urgent_only]
  description: Preferred notification level for proactive updates.
  initial_value: normal
