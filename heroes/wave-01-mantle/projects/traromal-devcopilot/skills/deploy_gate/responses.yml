responses:
  utter_confirm_deployment:
    - text: >
        Ready to deploy {session.deploy_gate.project_name} to
        {session.deploy_gate.environment}. Shall I go ahead?
  utter_deploy_cancelled:
    - text: No problem, nothing was deployed. Tell me what to change.
  utter_deploy_recorded:
    - text: >
        Deployment {session.deploy_gate.deploy_ref} succeeded.
        {session.deploy_gate.project_name} is live on
        {session.deploy_gate.environment}.
