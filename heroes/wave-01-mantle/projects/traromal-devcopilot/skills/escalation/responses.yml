responses:
  utter_confirm_escalation:
    - text: >
        I can raise an escalation to the on-call engineer. Would you like
        me to do that?
  utter_escalation_cancelled:
    - text: No problem, I will stay with you. What would you like to do instead?
  utter_escalation_raised:
    - text: >
        Escalation raised. Ticket E nine nine nine has been created
        for this demo, and the on-call engineer has been paged.
