responses:
  utter_confirm_job_close:
    - text: >
        I am ready to close task {session.job_close.job_ref} in
        {session.project.selected_project}. This finalizes the record.
        Shall I proceed?
  utter_job_close_cancelled:
    - text: Okay, I have not closed that task yet. Tell me what to change.
  utter_job_closed:
    - text: >
        Task closed. Any tools or licenses used are logged. The record is
        updated.
