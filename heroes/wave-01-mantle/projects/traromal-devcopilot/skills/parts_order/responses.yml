responses:
  utter_confirm_parts_order:
    - text: >
        Just to confirm, I will order {session.parts_order.qty} of
        {session.parts_order.part_no} for {session.project.selected_project}.
        Shall I go ahead?
  utter_parts_order_cancelled:
    - text: Okay, I have not placed that order. Tell me what to change.
  utter_parts_ordered:
    - text: >
        Your order is confirmed. Order reference
        {session.parts_order.order_ref} is booked and ships today.
  utter_confirm_approval_request:
    - text: >
        This item needs manager approval before it can ship. I can raise an
        approval request for {session.parts_order.qty} of
        {session.parts_order.part_no}. Shall I?
  utter_approval_cancelled:
    - text: No problem. Tell me what you would like to do instead.
  utter_approval_requested:
    - text: >
        Approval request {session.parts_order.order_ref} is raised. Your
        manager will review it, and you will be notified when it is approved.
