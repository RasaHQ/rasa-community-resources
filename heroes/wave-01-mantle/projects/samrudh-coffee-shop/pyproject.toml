[project]
name = "coffee-shop"
version = "0.1.0"
description = "Artisan Roast: Voice & Conversational Assistant for Coffee Shop Operations, Customer Loyalty, and Executive Analytics"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rasa-pro==3.20.0.dev9",
    "langfuse>=2.0.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "certifi>=2024.2.2",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[tool.uv]
prerelease = "allow"

[tool.rasa-catalog]
required-secrets = ["GEMINI_API_KEY"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib", "tools"]
