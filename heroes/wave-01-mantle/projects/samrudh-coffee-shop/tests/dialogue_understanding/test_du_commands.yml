# Dialogue Understanding (DU) Command Generator Tests for Artisan Roast
# Evaluates command extraction (StartFlow, SetSlot) independently using the replay mechanism.

test_cases:
  - test_case: Customer menu query command extraction
    steps:
      - user: What kind of iced coffees and teas do you serve?
        commands:
          - StartFlow("browse_coffee_menu")

  - test_case: Customer order request command extraction
    steps:
      - user: Can I place an order for a large Dark Chocolate?
        commands:
          - StartFlow("place_customer_order")

  - test_case: Loyalty points check command extraction
    steps:
      - user: Check rewards balance for CUST-1001
        commands:
          - StartFlow("check_loyalty_rewards")

  - test_case: Barista queue request command extraction
    steps:
      - user: Barista queue check for store 5
        commands:
          - StartFlow("process_store_orders")

  - test_case: Executive revenue query command extraction
    steps:
      - user: Give me an executive revenue and sales summary report.
        commands:
          - StartFlow("query_executive_analytics")

  - test_case: Restraint test - Smalltalk produces no commands
    steps:
      - user: Thanks, have a great day!
        commands: []
