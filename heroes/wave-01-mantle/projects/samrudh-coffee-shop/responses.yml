responses:
  utter_greet:
    - text: "Welcome to Artisan Roast Coffee Co.! Are you here to order coffee, check your loyalty rewards, or manage store operations?"

  utter_goodbye:
    - text: "Thank you for visiting Artisan Roast Coffee Co.! Enjoy your coffee and have a wonderful day."

  utter_confirm_coffee_order:
    - text: "Would you like me to submit your order now?"

  utter_coffee_order_cancelled:
    - text: "Your order has been cancelled. No charge was made. Can I help you with anything else?"

  utter_coffee_order_success:
    - text: "Your order has been placed and sent to the barista queue! It will be ready in about 5 minutes."

  utter_confirm_restock:
    - text: "Are you ready to record this inventory restock in the store database?"

  utter_restock_cancelled:
    - text: "Restock update cancelled. Store inventory was not modified."

  utter_outage_alert_sent:
    - text: "Emergency supply outage alert dispatched to the regional supply manager."
