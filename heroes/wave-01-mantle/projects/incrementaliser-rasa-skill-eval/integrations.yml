# Orchestrator LLM is a model-group reference. Provider settings live on the
# group, never inline under llm: (removed in rasa-pro 3.20.0.dev6).
llm:
  model_group: orchestrator

model_groups:
  - id: orchestrator
    models:
      - provider: openai
        model: gpt-5.2
        api_key_env: OPENAI_API_KEY

channels:
  rest:
    enabled: true
  inspector:
    enabled: true
