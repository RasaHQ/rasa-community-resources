responses:
  utter_recording_notice:
    - text: >
        This call may be recorded for quality assurance and training purposes.
  utter_stolen_warning:
    - text: >
        For your protection, we will immediately lock your card to prevent
        unauthorized transactions.
  utter_fraud_warning:
    - text: >
        For your protection, we will immediately lock your card and flag
        related activity for review.
  utter_confirm_block_card:
    - text: Are you sure you want to block card {selected_card_label}?
  utter_block_cancelled:
    - text: Okay, I will not block that card.
  utter_card_blocked:
    - text: >
        Card {selected_card_label} is now blocked and cannot be used for
        new transactions.
