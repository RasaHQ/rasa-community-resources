responses:
  utter_confirm_transfer:
    - text: >
        Transfer {amount} from account {account_number} to {payee_name} now?
  utter_confirm_scheduled_transfer:
    - text: >
        Schedule {amount} from account {account_number} to {payee_name}
        for {payment_date}?
  utter_transfer_cancelled:
    - text: Okay, I cancelled that transfer.
  utter_transfer_complete:
    - text: >
        Your transfer is complete. Reference {transfer_reference}.
        A confirmation has been noted on your account.
