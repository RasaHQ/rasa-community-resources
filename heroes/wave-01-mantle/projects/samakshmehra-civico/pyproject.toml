[project]
name = "civico"
version = "0.2.0"
description = "Voice agent for a municipal complaint line, built on Rasa Skills (Mantle)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "rasa-pro==3.20.0.dev6",
    "python-dotenv>=1.0.0",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
