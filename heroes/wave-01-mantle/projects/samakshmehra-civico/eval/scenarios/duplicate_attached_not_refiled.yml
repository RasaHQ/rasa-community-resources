# CIV1004 is seeded as an open drainage complaint in Vaishali. A second caller
# reporting the same blocked drain must be attached to it, not given a second
# complaint for the same hole in the ground — and must never be read the first
# caller's reference number.
scenario:
  name: The same incident is attached to the open complaint, not filed twice

  simulation_context: >
    You are reporting a blocked drain that is overflowing onto the footpath
    and smells. It is in Vaishali; accept the ward the agent offers. The exact
    spot is "outside the corner shop on the main road". Your callback number
    is nine eight seven six five four three two one zero. When the agent tells
    you an open complaint for the same problem already exists in that area,
    say that it sounds like the same one. Stop once the agent confirms your
    report has been added to it.

  goals:
    criteria:
      - The agent asks whether it is the same incident rather than deciding
        for the caller
      - The agent describes where the existing complaint is and roughly how
        long ago it was reported
      - The agent confirms the report was added to the existing complaint and
        does not claim a new complaint was created
    expected_tools:
      - tool_called: find_similar_open
      - tool_called: attach_to_existing
    assertions:
      - slot_was_set:
          - name: report_problem.duplicate_decision
            value: attach
      - bot_uttered:
          text_matches: "C I V one zero zero four"
