    models:
      - provider: openai
        model: gpt-5.6-luna
        api_key_env: OPENAI_API_KEY
  - id: openai-embeddings
    models:
      - provider: openai
        model: text-embedding-3-small
        api_key_env: OPENAI_API_KEY

