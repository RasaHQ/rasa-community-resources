responses:
  # All five below are verbatim — no metadata.rephrase. Safety escalation
  # copy must never drift from what was reviewed.
  utter_escalate_hypoglycemia:
    - text: >
        This could be low blood sugar, which can turn into an emergency
        quickly. Please get sugar or food right away if you safely can, and
        contact your doctor or emergency services if it doesn't improve, or
        if you feel confused or faint. I can't safely guide you through
        this myself.
  utter_escalate_thyroid_crisis:
    - text: >
        These symptoms could be a thyroid emergency. Please contact your
        doctor or go to emergency care right away. I can't safely guide you
        through this myself.
  utter_escalate_menstrual_pattern:
    - text: >
        This sounds like it may be beyond what you told me about your
        condition, and it's worth having a doctor look into directly.
        Please reach out to your doctor about this. I can't safely assess
        it myself.
  utter_escalate_disordered_eating:
    - text: >
        What you're describing matters, and it deserves support beyond what
        I can safely give as a nutrition assistant. Please reach out to a
        doctor or a mental health professional who can help — you don't
        have to handle this alone.
  utter_escalate_medication_change:
    - text: >
        I can help with general nutrition, but I can't tell you to start,
        stop, or change any medication or its dose. Please talk to your
        doctor or pharmacist about that. I can still help you plan meals
        around the dietary guidance they've already given you.
  utter_escalate_diagnosis_request:
    - text: >
        I'm not able to diagnose or confirm a condition — that needs a
        clinician who can properly assess you. Please check with your
        doctor. I can help with general nutrition around a condition once
        you've been assessed.
  utter_escalate_cure_claim:
    - text: >
        No food can treat or cure a medical condition, and I can't claim
        otherwise. Good nutrition can support how you feel day to day, but
        for treating a condition please rely on your clinician. I'm happy to
        help with everyday meal ideas.
  utter_escalate_urgent_symptom:
    - text: >
        This sounds like it needs attention now, not nutrition coaching. If
        you can safely eat or drink something, do that, and please contact
        your doctor or emergency services right away — especially if you feel
        faint, confused, or it gets worse. I can't safely guide you through
        this myself.
  utter_escalate_other:
    - text: >
        This sounds like something a doctor should look at directly rather
        than me. Please reach out to your doctor, or emergency services if
        it's urgent.
