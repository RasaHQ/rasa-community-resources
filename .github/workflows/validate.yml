name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: catches a resource going stale because an upstream release moved,
    # not because anyone touched this repository. The `upstream` job is what
    # makes that true — every other job here resolves against the committed
    # uv.lock and would not notice a new release at all.
    - cron: "0 6 * * 1"

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: offline gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # No dependencies to install: the tooling is stdlib-only by design.
      - name: make validate
        run: make validate STRICT=1

      # Machine-readable findings for anything that wants to consume them.
      - name: lint report
        if: always()
        run: python scripts/lint_repo.py --json > lint-report.json || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lint-report
          path: lint-report.json

  upstream:
    name: upstream release check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The only step in this workflow that queries PyPI. It reports the newest
      # rasa-pro overall — not just the newest on the pinned release line — and
      # inspects that release for the Mantle engine module, so the run says
      # whether RASA_PRO_VERSION_LINE can finally be lifted.
      #
      # Informational by design: a new upstream release is news, not a broken
      # repository, so this never fails the build.
      - name: make outdated
        run: |
          make outdated 2>&1 | tee /tmp/outdated.txt
          {
            echo '## Upstream rasa-pro'
            echo ''
            echo '```'
            tail -n 6 /tmp/outdated.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  discover:
    name: discover projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
      snapshots: ${{ steps.list.outputs.snapshots }}
    steps:
      # Full history: selecting which frozen snapshots a pull request touched
      # needs a real merge base to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: list
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          to_json() {
            python -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))'
          }

          # The maintained catalog: always checked in full.
          printf 'projects=' >> "$GITHUB_OUTPUT"
          python scripts/list_projects.py --paths-only | to_json >> "$GITHUB_OUTPUT"

          # Frozen snapshots resolve against a committed lock, so they stay
          # reproducible whatever upstream does. Running every past cohort's
          # project on every pull request would still be pure cost, so a PR
          # checks only what it touched; scheduled and push runs check them all,
          # which is where a yanked release or a rotted lock actually surfaces.
          ALL=$(python scripts/list_projects.py --scope snapshots --paths-only)
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            SELECTED=""
            for path in ${ALL}; do
              if printf '%s\n' "${CHANGED}" | grep -q "^${path}/"; then
                SELECTED="${SELECTED}${path}"$'\n'
              fi
            done
          else
            SELECTED="${ALL}"
          fi
          printf 'snapshots=' >> "$GITHUB_OUTPUT"
          printf '%s\n' "${SELECTED}" | to_json >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.project }}
    needs: [validate, discover]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.projects) }}
    # Job-level so the training step's `if:` can test it. Secrets are not
    # readable from a step-level `if:` that references its own step env.
    env:
      RASA_LICENSE: ${{ secrets.RASA_LICENSE }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      # Resources built on another provider declare the key they need in
      # [tool.rasa-catalog] required-secrets. When the secret is absent the
      # train step skips and says so rather than failing on an unexpanded
      # variable; add the secret and those resources start training too.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "${{ matrix.project }}/uv.lock"

      # Installs the project and asserts the pinned rasa-pro plus a working
      # rasa.calm_v2, then runs validate_project.
      - name: check ${{ matrix.project }}
        run: python scripts/check_project.py "${{ matrix.project }}"

      # Training needs a licence. It only runs where the secret exists, and
      # --require-license makes a missing one a hard failure rather than a
      # silent skip that looks like a pass.
      - name: train ${{ matrix.project }}
        if: env.RASA_LICENSE != ''
        run: |
          python scripts/check_project.py "${{ matrix.project }}" \
            --train --require-license --skip-sync

  snapshots:
    # One job that loops, rather than a matrix over wave projects.
    #
    # `heroes/` is empty until the first cohort lands, and an empty matrix does
    # not simply vanish: GitHub lists the job as skipped and renders its name as
    # the literal matrix expression, so every pull request carries a check that
    # looks broken and is not. A single job with a static name costs parallelism
    # only when several wave projects change at once, which has not happened
    # yet. Make it a matrix again when it does.
    name: frozen snapshots
    needs: [validate, discover]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # A frozen resource is only worth keeping if the claim on its README is
      # true, and the claim is "this installs and validates at the version I
      # pinned". So it is asserted against its own pin — never RASA_PRO_VERSION,
      # which it is exempt from by design. See docs/SNAPSHOTS.md.
      #
      # No training step: a past cohort's project should not need live secrets,
      # and a train failure two years on is an archive decision, not a red build
      # on somebody else's pull request.
      - name: check frozen snapshots
        env:
          SNAPSHOTS: ${{ needs.discover.outputs.snapshots }}
        run: |
          set -euo pipefail
          mapfile -t PROJECTS < <(
            printf '%s' "$SNAPSHOTS" |
              python -c 'import json,sys; [print(p) for p in json.load(sys.stdin)]'
          )
          if [ "${#PROJECTS[@]}" -eq 0 ]; then
            echo "No frozen wave projects to check."
            echo "No frozen wave projects to check." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          failed=0
          for project in "${PROJECTS[@]}"; do
            echo "::group::${project}"
            if ! python scripts/check_project.py "${project}" --use-project-pin; then
              failed=1
              echo "::error::${project} failed its own-pin check"
            fi
            echo "::endgroup::"
          done
          exit "${failed}"
