name: Daily Rasa release assurance
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rasa-release-assurance
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      RASA_LICENSE: ${{ secrets.RASA_LICENSE }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SPEECHMATICS_API_KEY: ${{ secrets.SPEECHMATICS_API_KEY }}
      RIME_API_KEY: ${{ secrets.RIME_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Verify release selection logic
        run: uv run --with packaging==26.3 python -m unittest discover -s scripts/releases
      - name: Discover and prepare candidate
        run: uv run --with packaging==26.3 python scripts/releases/update.py
      - name: Execute compatibility and build gates
        run: |
          make ci KEEP_GOING=1
          python scripts/compatibility.py --train --logs /tmp/rasa-catalog-compatibility
      - name: Propose tested update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/releases/propose.py
      - name: Preserve candidate diff
        if: always()
        run: git diff --binary > /tmp/rasa-candidate.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rasa-release-assurance-${{ github.run_id }}
          path: |
            RASA_RELEASE.json
            COMPATIBILITY.json
            /tmp/rasa-candidate.patch
            /tmp/rasa-catalog-compatibility/
            /tmp/rasa-compatibility-live/
          retention-days: 30
