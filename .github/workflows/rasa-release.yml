name: Rasa release maintenance
on:
  schedule:
    - cron: '23 3,9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rasa-release-assurance
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      RASA_LICENSE: ${{ secrets.RASA_LICENSE }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SPEECHMATICS_API_KEY: ${{ secrets.SPEECHMATICS_API_KEY }}
      RIME_API_KEY: ${{ secrets.RIME_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Run release maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_MERGE: ${{ vars.RASA_RELEASE_AUTO_MERGE != 'false' }}
        run: |
          merge_flag=()
          if [ "$AUTO_MERGE" = "true" ]; then merge_flag=(--merge); fi
          uv run --with packaging==26.3 python scripts/releases/maintenance.py --kind catalog "${merge_flag[@]}"
      - name: Write repair handoff even after setup failure
        if: always()
        env:
          MAINTENANCE_JOB_STATUS: ${{ job.status }}
        run: python scripts/releases/maintenance.py --kind catalog --report-only --job-status "$MAINTENANCE_JOB_STATUS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rasa-release-maintenance
          path: /tmp/rasa-release-maintenance/
          if-no-files-found: error
          retention-days: 90
