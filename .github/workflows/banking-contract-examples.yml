name: Self-contained banking contract controls

on:
  pull_request:
    paths:
      - '.github/workflows/banking-contract-examples.yml'
      - 'scripts/banking_contract_scope.py'
      - 'scripts/test_banking_contract_scope.py'
      - '.devcontainer/**'
      - 'examples/jack-henry-symitar/**'
      - 'examples/jack-henry-silverlake/**'
      - 'examples/fiserv-premier-11.0.0-prm/**'
      - 'examples/fiserv-banking-hub-11.0.0.2026.4.1/**'
  push:
    paths:
      - '.github/workflows/banking-contract-examples.yml'
      - 'scripts/banking_contract_scope.py'
      - 'scripts/test_banking_contract_scope.py'
      - '.devcontainer/**'
      - 'examples/jack-henry-symitar/**'
      - 'examples/jack-henry-silverlake/**'
      - 'examples/fiserv-premier-11.0.0-prm/**'
      - 'examples/fiserv-banking-hub-11.0.0.2026.4.1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check empty, complete, and incomplete selections
        run: python3 -m unittest discover -s scripts -p test_banking_contract_scope.py -v
      - id: projects
        name: Select complete contract examples present on this revision
        run: python3 scripts/banking_contract_scope.py
  controls:
    needs: selected
    if: ${{ needs.selected.outputs.projects != '[]' }}
    name: Banking contract tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.selected.outputs.projects) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build the selected locked environment and run actual controls
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca
        with:
          configFile: .devcontainer/examples-${{ matrix.project }}/devcontainer.json
          push: never
          inheritEnv: false
          runCmd: |
            set -eu
            unset RASA_LICENSE RASA_PRO_LICENSE OPENAI_API_KEY ANTHROPIC_API_KEY DEEPGRAM_API_KEY GEMINI_API_KEY
            cd "$(git rev-parse --show-toplevel)/examples/${{ matrix.project }}"
            make test
