name: Rasa compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rasa-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Full maintained catalog behavior
        run: |
          make ci KEEP_GOING=1
          python scripts/compatibility.py --out /tmp/rasa-catalog-offline.json
      - name: Release policy regression tests
        run: uv run --with packaging==26.3 python -m unittest discover -s scripts/releases
